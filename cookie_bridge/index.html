<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
// Tiny Streamlit "bidirectional component" with no dependencies. It reads the
// studyspace_token cookie in the browser and reports it to the Python side.
// Needed because Streamlit Community Cloud does not pass this cookie to st.context.cookies.
(function () {
  function post(msg) {
    msg.isStreamlitMessage = true;
    window.parent.postMessage(msg, "*");
  }
  function getCookie(name) {
    var parts = document.cookie.split(";");
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i].trim();
      if (p.indexOf(name + "=") === 0) return p.substring(name.length + 1);
    }
    return "";
  }
  var last = null;
  window.addEventListener("message", function (ev) {
    var d = ev.data || {};
    if (d.type !== "streamlit:render") return;
    var token = getCookie("studyspace_token");
    if (token !== last) {
      last = token;
      post({ type: "streamlit:setComponentValue", value: { token: token }, dataType: "json" });
    }
  });
  post({ type: "streamlit:componentReady", apiVersion: 1 });
  post({ type: "streamlit:setFrameHeight", height: 0 });
})();
</script>
</body>
</html>
